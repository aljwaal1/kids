*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#eef2ff;color:#172033}body{overflow-x:hidden}.app{min-height:100vh;background:linear-gradient(150deg,#f4f6ff 0%,#fff7ef 50%,#f0fff8 100%)}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:13px 12px;color:#fff;background:linear-gradient(115deg,#5b21b6,#4338ca 46%,#0ea5e9);box-shadow:0 4px 18px rgba(50,35,150,.30)}.top h1{font-size:22px;margin:0;flex:1;text-align:center;font-weight:900}.top button{border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.16);color:#fff;border-radius:15px;padding:10px 14px;font-size:16px;font-weight:800}.screen{padding:18px 14px 28px;animation:pop .25s ease}@keyframes pop{from{opacity:.25;transform:scale(.98)}to{opacity:1;transform:scale(1)}}.hero{padding:22px 16px;border-radius:30px;background:linear-gradient(135deg,#6d28d9,#4f46e5 50%,#06b6d4);color:#fff;box-shadow:0 12px 30px rgba(79,70,229,.28);text-align:center;margin-bottom:18px}.hero .big{font-size:38px;font-weight:900}.hero .small{font-size:18px;line-height:1.7;opacity:.96}.stats{display:flex;gap:8px;margin-top:15px}.stat{flex:1;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:18px;padding:10px 5px;font-weight:800}.menu{display:grid;grid-template-columns:1fr;gap:13px}.menu-card{display:flex;align-items:center;gap:14px;border:0;border-radius:25px;padding:15px;color:#fff;text-align:right;box-shadow:0 8px 20px rgba(32,39,95,.18);font-weight:900;width:100%}.menu-card .badge{width:70px;height:70px;display:flex;align-items:center;justify-content:center;border-radius:22px;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.48);font-size:32px}.menu-card .copy{flex:1}.menu-card .title{font-size:24px}.menu-card .sub{font-size:14px;margin-top:5px;opacity:.95;line-height:1.5}.purple{background:linear-gradient(135deg,#7c3aed,#4f46e5)}.blue{background:linear-gradient(135deg,#0284c7,#2563eb)}.green{background:linear-gradient(135deg,#059669,#16a34a)}.orange{background:linear-gradient(135deg,#ea580c,#f59e0b)}.pink{background:linear-gradient(135deg,#db2777,#e11d48)}.gold{background:linear-gradient(135deg,#d97706,#f59e0b)}.section-title{text-align:center;font-size:29px;font-weight:900;margin:5px 0 4px}.section-sub{text-align:center;color:#4b5563;font-size:16px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item{border:3px solid var(--c);border-radius:24px;background:#fff;padding:9px;box-shadow:0 7px 18px rgba(30,41,59,.13);min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center}.item .thumb{width:100%;height:116px;border-radius:19px;overflow:hidden;background:linear-gradient(145deg,var(--soft),#fff)}.item .letter{font-size:35px;font-weight:900;color:#111827;margin-top:4px}.item .word{font-size:17px;font-weight:800;color:#374151;margin-top:2px;text-align:center}.item .open{font-size:13px;font-weight:900;color:var(--c);margin-top:5px}.detail-wrap{max-width:540px;margin:0 auto}.detail-card{border-radius:32px;background:#fff;box-shadow:0 16px 38px rgba(35,40,90,.22);overflow:hidden;border:4px solid var(--c)}.detail-art{height:300px;padding:15px;background:linear-gradient(145deg,var(--soft),#fff)}.detail-letter{text-align:center;font-size:74px;line-height:1;font-weight:900;color:var(--c);margin-top:12px}.detail-word{text-align:center;font-size:34px;font-weight:900;color:#172033;margin:6px 0}.detail-hint{text-align:center;color:#596275;font-size:16px;margin-bottom:13px}.speak{display:block;width:78%;margin:0 auto 18px;border:0;border-radius:20px;padding:15px;background:linear-gradient(120deg,var(--c),#4338ca);color:#fff;font-size:21px;font-weight:900;box-shadow:0 8px 16px rgba(67,56,202,.28)}.nav{display:flex;align-items:center;gap:10px;margin-top:15px}.nav button{flex:1;border:0;border-radius:21px;padding:17px 8px;color:#fff;font-size:18px;font-weight:900;box-shadow:0 7px 16px rgba(30,41,59,.20)}.prev{background:linear-gradient(135deg,#0284c7,#2563eb)}.next{background:linear-gradient(135deg,#e11d48,#f97316)}.counter{min-width:88px;text-align:center;border-radius:18px;padding:13px 7px;background:#fff;border:2px solid #c7d2fe;font-weight:900;color:#4338ca}.classic{margin-top:17px;background:#fff;border:3px solid #7c3aed;color:#5b21b6;border-radius:22px;padding:16px;width:100%;font-size:19px;font-weight:900}.svgbox svg{width:100%;height:100%;display:block}.tip{padding:12px 14px;border-radius:18px;background:#fff7ed;border:2px solid #fb923c;color:#9a3412;text-align:center;font-weight:800;margin-bottom:14px}@media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}

<script>
var palettes=['#7c3aed','#2563eb','#059669','#ea580c','#db2777','#d97706'];
function item(t,w,k,lang,i){return{title:t,word:w,icon:k,lang:lang,color:palettes[i%palettes.length]};}
function makeLetters(chars,words,icons,lang){var a=[];for(var i=0;i<chars.length;i++)a.push(item(chars[i],words[i],icons[i],lang,i));return a;}
var arLetters=makeLetters(['أ','ب','ت','ث','ج','ح','خ','د','ذ','ر','ز','س','ش','ص','ض','ط','ظ','ع','غ','ف','ق','ك','ل','م','ن','هـ','و','ي'],['أسد','بطة','تفاحة','ثعلب','جمل','حصان','خروف','دجاجة','ذرة','رمان','زرافة','سيارة','شمس','صقر','ضفدع','طائرة','ظرف','عصفور','غزال','فيل','قطة','كلب','ليمون','موز','نمر','هلال','وردة','يد'],['lion','bird','apple','fox','camel','horse','sheep','chicken','corn','pomegranate','giraffe','car','sun','bird','frog','plane','envelope','bird','deer','elephant','cat','dog','lemon','banana','tiger','moon','flower','hand'],'ar');
var enLetters=makeLetters('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),['Apple','Ball','Car','Dog','Elephant','Fish','Giraffe','Horse','Ice Cream','Juice','Kite','Lion','Monkey','Nest','Orange','Panda','Queen','Rabbit','Sun','Tiger','Umbrella','Van','Water','Xylophone','Yo-yo','Zebra'],['apple','ball','car','dog','elephant','fish','giraffe','horse','icecream','juice','kite','lion','monkey','nest','orange','panda','crown','rabbit','sun','tiger','umbrella','van','water','xylophone','yoyo','zebra'],'en');
var arNums=[],enNums=[],arNames=['واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة'],enNames=['One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten'];for(var n=1;n<=10;n++){arNums.push(item(String(n),arNames[n-1],'number','ar',n));enNums.push(item(String(n),enNames[n-1],'number','en',n));}
var colorsAr=[item('أحمر','Red','color-red','ar',0),item('أزرق','Blue','color-blue','ar',1),item('أخضر','Green','color-green','ar',2),item('أصفر','Yellow','color-yellow','ar',3),item('أسود','Black','color-black','ar',4),item('أبيض','White','color-white','ar',5),item('بني','Brown','color-brown','ar',0),item('بنفسجي','Purple','color-purple','ar',1)];
var colorsEn=[item('Red','أحمر','color-red','en',0),item('Blue','أزرق','color-blue','en',1),item('Green','أخضر','color-green','en',2),item('Yellow','أصفر','color-yellow','en',3),item('Black','أسود','color-black','en',4),item('White','أبيض','color-white','en',5),item('Brown','بني','color-brown','en',0),item('Purple','بنفسجي','color-purple','en',1)];
var animalsAr=makeLetters(['أسد','فيل','قطة','كلب','حصان','أرنب','بقرة','قرد','زرافة','نمر','دب','سمكة'],['Lion','Elephant','Cat','Dog','Horse','Rabbit','Cow','Monkey','Giraffe','Tiger','Bear','Fish'],['lion','elephant','cat','dog','horse','rabbit','cow','monkey','giraffe','tiger','bear','fish'],'ar');
var animalsEn=makeLetters(['Lion','Elephant','Cat','Dog','Horse','Rabbit','Cow','Monkey','Giraffe','Tiger','Bear','Fish'],['أسد','فيل','قطة','كلب','حصان','أرنب','بقرة','قرد','زرافة','نمر','دب','سمكة'],['lion','elephant','cat','dog','horse','rabbit','cow','monkey','giraffe','tiger','bear','fish'],'en');
var current={title:'',items:[],rtl:true,index:0};
function soft(c){return c+'22';}function tap(){try{Android.tap();}catch(e){}}
function top(title,back){return '<div class="top">'+(back?'<button onclick="history.back();tap()">رجوع</button>':'')+'<h1>'+title+'</h1>'+(back?'<span style="width:68px"></span>':'')+'</div>';}
function showHome(push){if(push!==false)history.pushState({p:'home'},'', '#home');var h=top('طفلي الأول',false)+'<div class="screen"><div class="hero"><div class="big">تعلّم • شاهد • استمع</div><div class="small">حروف وصور ملوّنة بحجم كبير، تعمل دون إنترنت وعلى Android 4.4</div><div class="stats"><div class="stat">صور واضحة</div><div class="stat">تنقل بالأسهم</div><div class="stat">نطق عربي وإنجليزي</div></div></div><div class="menu">';h+=menu('ع','العربية','الحروف والأرقام والألوان والحيوانات','purple','showArabic()');h+=menu('A','English','Letters, numbers, colors and animals','blue','showEnglish()');h+=menu('ح','الحيوانات','صور وأسماء بالعربية والإنجليزية','orange',"openList('الحيوانات',animalsAr,true)");h+=menu('★','الألعاب والإنجازات','افتح الألعاب، النجوم وتسجيل صوت الوالدين','green','openClassic()');h+='</div></div>';document.getElementById('app').innerHTML=h;}
function menu(icon,title,sub,cls,action){return '<button class="menu-card '+cls+'" onclick="tap();'+action+'"><span class="badge">'+icon+'</span><span class="copy"><span class="title">'+title+'</span><span class="sub">'+sub+'</span></span><span style="font-size:36px">‹</span></button>';}
function showArabic(){history.pushState({p:'ar'},'','#arabic');var h=top('العربية',true)+'<div class="screen"><div class="section-title">اختر الدرس</div><div class="section-sub">كل بطاقة تفتح صورة كبيرة مع سهم يمين ويسار</div><div class="menu">';h+=menu('أ','الحروف العربية','28 حرفًا مع صورة وكلمة','purple',"openList('الحروف العربية',arLetters,true)");h+=menu('١','الأرقام 1 - 10','العدد والاسم والصورة','blue',"openList('الأرقام العربية',arNums,true)");h+=menu('●','الألوان','ألوان قوية وواضحة','pink',"openList('الألوان',colorsAr,true)");h+=menu('ح','الحيوانات','صور مبسطة ومحببة','orange',"openList('الحيوانات',animalsAr,true)");h+='</div></div>';document.getElementById('app').innerHTML=h;}
function showEnglish(){history.pushState({p:'en'},'','#english');var h=top('English',true)+'<div class="screen" dir="ltr"><div class="section-title">Choose a lesson</div><div class="section-sub">Open a card, then move with the left and right arrows</div><div class="menu">';h+=menu('A','Capital Letters','26 letters with a picture and word','blue',"openList('Capital Letters',enLetters,false)");h+=menu('1','Numbers 1 - 10','Number, name and picture','green',"openList('English Numbers',enNums,false)");h+=menu('●','Colors','Strong, clear colors','pink',"openList('Colors',colorsEn,false)");h+=menu('C','Animals','Friendly illustrated animals','orange',"openList('Animals',animalsEn,false)");h+='</div></div>';document.getElementById('app').innerHTML=h;}
function openList(title,items,rtl){current={title:title,items:items,rtl:rtl,index:0};history.pushState({p:'list'},'','#list');renderList();}
function renderList(){var h=top(current.title,true)+'<div class="screen" dir="'+(current.rtl?'rtl':'ltr')+'"><div class="tip">'+(current.rtl?'اضغط البطاقة لتفتح الصورة بالحجم الكبير، ثم استخدم الأسهم':'Tap a card for the large picture, then use the arrows')+'</div><div class="grid">';for(var i=0;i<current.items.length;i++){var x=current.items[i];h+='<button class="item" style="--c:'+x.color+';--soft:'+soft(x.color)+'" onclick="openDetail('+i+')"><div class="thumb svgbox">'+svgIcon(x.icon,x.color,x.title)+'</div><div class="letter">'+x.title+'</div><div class="word">'+x.word+'</div><div class="open">'+(current.rtl?'فتح الصورة':'Open picture')+'</div></button>';}h+='</div></div>';document.getElementById('app').innerHTML=h;}
function openDetail(i){tap();current.index=i;history.pushState({p:'detail'},'','#detail');renderDetail();setTimeout(speakCurrent,220);}
function renderDetail(){var x=current.items[current.index];var h=top(current.title,true)+'<div class="screen detail-wrap" dir="'+(current.rtl?'rtl':'ltr')+'"><div class="detail-card" style="--c:'+x.color+';--soft:'+soft(x.color)+'"><div class="detail-art svgbox">'+svgIcon(x.icon,x.color,x.title)+'</div><div class="detail-letter">'+x.title+'</div><div class="detail-word">'+x.word+'</div><div class="detail-hint">'+(current.rtl?'اضغط للاستماع إلى الحرف والكلمة':'Tap to hear the letter and word')+'</div><button class="speak" onclick="speakCurrent()">'+(current.rtl?'🔊 استمع':'🔊 Listen')+'</button></div><div class="nav"><button class="prev" onclick="move(-1)">← '+(current.rtl?'السابق':'Previous')+'</button><div class="counter">'+(current.index+1)+' / '+current.items.length+'</div><button class="next" onclick="move(1)">'+(current.rtl?'التالي':'Next')+' →</button></div></div>';document.getElementById('app').innerHTML=h;}
function move(d){tap();current.index=(current.index+d+current.items.length)%current.items.length;renderDetail();setTimeout(speakCurrent,160);}
function speakCurrent(){var x=current.items[current.index];tap();try{Android.speak((x.lang==='ar'?'حرف ':'')+x.title+'. '+x.word,x.lang);}catch(e){}}
function openClassic(){tap();try{Android.openClassic();}catch(e){}}
window.onpopstate=function(e){var p=e.state&&e.state.p;if(p==='detail')renderDetail();else if(p==='list')renderList();else if(p==='ar')showArabicNoPush();else if(p==='en')showEnglishNoPush();else showHome(false);};
function showArabicNoPush(){var old=history.pushState;history.pushState=function(){};showArabic();history.pushState=old;}function showEnglishNoPush(){var old=history.pushState;history.pushState=function(){};showEnglish();history.pushState=old;}
function shell(body,bg){return '<svg viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="'+bg+'"/><stop offset="1" stop-color="#ffffff"/></linearGradient></defs><rect x="4" y="4" width="292" height="212" rx="34" fill="url(#g)"/>'+body+'</svg>';}

01)+'<circle cx="150" cy="128" r="10" fill="#4b2e20"/><path d="M128 144 Q150 163 172 144" fill="none" stroke="#4b2e20" stroke-width="7" stroke-linecap="round"/>';if(key==='rabbit')b='<ellipse cx="118" cy="55" rx="24" ry="58" fill="#f9a8d4"/><ellipse cx="182" cy="55" rx="24" ry="58" fill="#f9a8d4"/>'+b;if(key==='tiger'||key==='zebra')b+='<path d="M110 63 L125 88 M150 50 L150 83 M190 63 L175 88" stroke="#172033" stroke-width="8" stroke-linecap="round"/>';if(key==='panda')b+='<circle cx="120" cy="100" r="21" fill="#172033"/><circle cx="180" cy="100" r="21" fill="#172033"/>';if(key==='bird'||key==='chicken')b+='<path d="M210 115 L255 130 L210 145 Z" fill="#f97316"/>';if(key==='camel')b+='<path d="M80 171 Q115 105 150 171 Q190 95 225 171" fill="#d97706" opacity=".9"/>';}
